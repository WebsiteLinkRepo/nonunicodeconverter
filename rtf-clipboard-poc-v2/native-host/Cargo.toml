[package]
name = "rtf-native-messaging"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "rtf_native_host"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.48"
features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
