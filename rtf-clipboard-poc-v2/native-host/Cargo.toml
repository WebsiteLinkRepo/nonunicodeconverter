[package]
name = "rtf-native-messaging"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "rtf_native_host"
path = "src/main.rs"

[dependencies]
# Exact pins for Rust 1.77.2 compatibility (Windows 7)
# Using = to force exact versions and avoid memchr 2.8+ (requires Rust 1.78+)
serde = { version = "=1.0.196", features = ["derive"] }
serde_json = "=1.0.113"

[target.'cfg(windows)'.dependencies.windows]
version = "0.48"
features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Statically link the C runtime to avoid requiring VC++ Redistributable
[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
