[package]
name = "clipboard-inspector"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "clipboard_inspector"
path = "clipboard_inspector.rs"

[target.'cfg(windows)'.dependencies.windows]
version = "0.48"
features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
]

# Statically link the C runtime to avoid requiring VC++ Redistributable
[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
