<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @font-face {
      font-family: 'Shree';
      src: url('../public/SHREE-TEL-web.ttf') format('truetype');
    }
    .shree {
      font-family: 'Shree';
      font-size: 80px;
    }
  </style>
</head>
<body>
  <div>0x00AC (logical not):</div><div class="shree">&#xAC;</div>
  <div>0x02DC (Small tilde):</div><div class="shree">&#x2DC;</div>
  <div>0x005C (backslash \ - Nga?):</div><div class="shree">&#x5C;</div>
  <div>0x0153 (oe - Gha?):</div><div class="shree">&#x153;</div>
  <div>0x00E0 (a grave - Ha?):</div><div class="shree">&#xE0;</div>
</body>
</html>
