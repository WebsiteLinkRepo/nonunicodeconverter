<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @font-face {
            font-family: 'Shree-Tel';
            src: url('../public/SHREE-TEL-web.ttf');
        }
        body { font-family: sans-serif; font-size: 16px; padding: 20px;}
        .container { display: flex; flex-wrap: wrap; }
        .item { width: 100px; margin: 10px; border: 1px solid #ccc; text-align: center; }
        .shree { font-family: 'Shree-Tel'; font-size: 64px; background: #eee; min-height: 80px; }
    </style>
</head>
<body>
    <div class="container" id="grid"></div>
    <script>
        const grid = document.getElementById('grid');
        const codes = [];
        for(let i=0x20; i<=0xE5; i++) codes.push(i);
        
        for (const code of codes) {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<div class="shree">&#${code};</div><div>0x${code.toString(16).toUpperCase()}</div>`;
            grid.appendChild(div);
        }
    </script>
</body>
</html>
