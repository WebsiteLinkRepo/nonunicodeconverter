<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @font-face {
            font-family: 'Shree-Tel';
            src: url('../public/SHREE-TEL-web.ttf');
        }
        body { font-family: sans-serif; }
        .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
        .cell { border: 1px solid #ccc; padding: 5px; text-align: center; }
        .char { font-family: 'Shree-Tel'; font-size: 64px; min-height: 80px; line-height: 1.2; display: block; background: #eee; }
        .hex { font-size: 14px; color: #666; font-family: monospace; }
        .unicode { font-size: 10px; color: #999; }
    </style>
</head>
<body>
    <div class="grid" id="grid"></div>
    <script>
        const grid = document.getElementById('grid');
        function add(cp) {
            const hex = cp.toString(16).padStart(4, '0').toUpperCase();
            // Actually, in JS we have to make sure we use the correct un-encoded character codes if we are using document.textContent
            // We want to literally show that char code.
            
            // CP1252 to Unicode mapping for rendering textContent correctly! 
            // Wait, character codes like 0x80 are treated as Unicode when passed to FROMCHARCODE!
            // We must use the MACINTOSH or WINDOWS 1252 mapped char code.
            let char = String.fromCharCode(cp);
            
            const cell = document.createElement('div');
            cell.className = 'cell';
            
            const charDiv = document.createElement('div');
            charDiv.className = 'char';
            charDiv.textContent = char;
            
            const hexDiv = document.createElement('div');
            hexDiv.className = 'hex';
            hexDiv.textContent = '0x' + hex;
            
            const uniDiv = document.createElement('div');
            uniDiv.className = 'unicode';
            let uHex = char.charCodeAt(0).toString(16).padStart(4, '0').toUpperCase();
            uniDiv.textContent = 'U+' + uHex;

            cell.appendChild(charDiv);
            cell.appendChild(hexDiv);
            cell.appendChild(uniDiv);
            grid.appendChild(cell);
        }
        
        // Let's iterate all the code points we actually output in the map
        const points = [
            0xA0, 0xA1, 0xA2, 0xA3, 0xA4, 0xA5, 0xA6, 0xA7, 0xA8, 0xA9, 0xAA, 0xAB, 0xAC, 0xAD, 0xAE, 0xAF,
            0xB0, 0xB1, 0xB2, 0xB3, 0xB4, 0xB5, 0xB6, 0xB7, 0xB8, 0xB9, 0xBA, 0xBB, 0xBC, 0xBD, 0xBE, 0xBF,
            0xC0, 0xC1, 0xC2, 0xC3, 0xC4, 0xC5, 0xC6, 0xC7, 0xC8, 0xC9, 0xCA, 0xCB, 0xCC, 0xCD, 0xCE, 0xCF,
            0xD0, 0xD1, 0xD2, 0xD3, 0xD4, 0xD5, 0xD6, 0xD7, 0xD8, 0xD9, 0xDA, 0xDB, 0xDC, 0xDD, 0xDE, 0xDF,
            0xE0, 0xE1, 0xE2, 0xE3, 0xE4, 0xE5, 0xE6, 0xE7, 0xE8, 0xE9, 0xEA, 0xEB, 0xEC, 0xED, 0xEE, 0xEF,
            0xF0, 0xF1, 0xF2, 0xF3, 0xF4, 0xF5, 0xF6, 0xF7, 0xF8, 0xF9, 0xFA, 0xFB, 0xFC, 0xFD, 0xFE, 0xFF,
            // cp1252 points mapped properly
            0x20AC, 0x201A, 0x0192, 0x201E, 0x2026, 0x2020, 0x2021, 0x02C6, 0x2030, 0x0160, 0x2039, 0x0152,
            0x2018, 0x2019, 0x201C, 0x201D, 0x2022, 0x2013, 0x2014, 0x02DC, 0x2122, 0x0161, 0x203A, 0x0153, 0x0178
        ];
        
        for (let cp of points) {
            add(cp);
        }
    </script>
</body>
</html>
