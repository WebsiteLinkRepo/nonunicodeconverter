<title>Telugu Shree-Lipi Fix Verification</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg: #fafafa;
  --surface: #fff;
  --text: #1a1a1a;
  --muted: #737373;
  --border: #e5e5e5;
  --success: #16a34a;
  --success-bg: #f0fdf4;
  --code-bg: #f5f5f5;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0a;
    --surface: #171717;
    --text: #fafafa;
    --muted: #a3a3a3;
    --border: #262626;
    --success: #22c55e;
    --success-bg: #14532d;
    --code-bg: #262626;
  }
}

:root[data-theme="dark"] {
  --bg: #0a0a0a;
  --surface: #171717;
  --text: #fafafa;
  --muted: #a3a3a3;
  --border: #262626;
  --success: #22c55e;
  --success-bg: #14532d;
  --code-bg: #262626;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  line-height: 1.6;
  padding: 2rem 1rem;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

header {
  margin-bottom: 2.5rem;
  text-align: center;
}

h1 {
  font-size: 2rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.subtitle {
  color: var(--muted);
  font-size: 1rem;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.5rem 1rem;
  background: var(--success-bg);
  color: var(--success);
  border-radius: 2rem;
  font-weight: 500;
  font-size: 0.875rem;
  margin-top: 1rem;
}

.section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 0.5rem;
  padding: 1.5rem;
  margin-bottom: 1.5rem;
}

.section-title {
  font-size: 1.125rem;
  font-weight: 600;
  margin-bottom: 1rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 1rem;
}

.char-card {
  border: 1px solid var(--border);
  border-radius: 0.375rem;
  padding: 1rem;
  text-align: center;
  transition: border-color 0.2s;
}

.char-card.fixed {
  border-color: var(--success);
  background: var(--success-bg);
}

.unicode-display {
  font-size: 3rem;
  font-family: 'Noto Sans Telugu', sans-serif;
  line-height: 1;
  margin-bottom: 0.75rem;
}

.shree-display {
  font-size: 3rem;
  font-family: 'Shree-Tel', monospace;
  line-height: 1;
  margin-bottom: 0.75rem;
  color: var(--success);
}

.char-label {
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 500;
}

.fix-badge {
  display: inline-block;
  margin-top: 0.5rem;
  padding: 0.125rem 0.5rem;
  background: var(--success);
  color: white;
  border-radius: 0.25rem;
  font-size: 0.75rem;
  font-weight: 500;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
}

th {
  text-align: left;
  padding: 0.75rem 1rem;
  border-bottom: 2px solid var(--border);
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-size: 0.75rem;
}

td {
  padding: 0.75rem 1rem;
  border-bottom: 1px solid var(--border);
}

.code {
  font-family: 'JetBrains Mono', monospace;
  background: var(--code-bg);
  padding: 0.125rem 0.375rem;
  border-radius: 0.25rem;
  font-size: 0.875rem;
}

.arrow {
  color: var(--muted);
  font-weight: 600;
}

@font-face {
  font-family: 'Shree-Tel';
  src: url('/SHREE-TEL.ttf') format('truetype');
}
</style>

<div class="container">
  <header>
    <h1>Telugu Shree-Lipi Converter</h1>
    <p class="subtitle">All character mappings verified and fixed</p>
    <div class="badge">
      <span>✓</span>
      <span>9 characters corrected, 2 talakattu flags updated</span>
    </div>
  </header>

  <div class="section">
    <h2 class="section-title">Fixed Characters</h2>
    <div class="grid" id="fixedGrid"></div>
  </div>

  <div class="section">
    <h2 class="section-title">All 36 Consonants</h2>
    <div class="grid" id="allGrid"></div>
  </div>

  <div class="section">
    <h2 class="section-title">Mapping Changes</h2>
    <table id="changesTable">
      <thead>
        <tr>
          <th>Character</th>
          <th>Name</th>
          <th>Old Mapping</th>
          <th></th>
          <th>New Mapping</th>
          <th>Talakattu</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const fixes = [
  { char: 'ఘ', name: 'Gha', old: '0x52 (R)', new: '0x50 (P)', tala: 'true' },
  { char: 'ఙ', name: 'Nga', old: '0x5A (Z)', new: '0x5C (\\)', tala: 'false' },
  { char: 'జ', name: 'Ja', old: '0x5C (\\)', new: '0x66 (f)', tala: 'true' },
  { char: 'ణ', name: 'Ana', old: '0x7E (~)', new: '0xD7 (×)', tala: 'false ✓' },
  { char: 'మ', name: 'Ma', old: '0xC4 (Ä)', new: '0x47 (G)', tala: 'true' },
  { char: 'ల', name: 'La', old: '0xCB (Ë)', new: '0xCC (Ì)', tala: 'false' },
  { char: 'ష', name: 'Sha', old: '0xD9 (Ù)', new: '0x201E („)', tala: 'true' },
  { char: 'స', name: 'Sa', old: '0xDC (Ü)', new: '0xA8 (¨)', tala: 'true' },
  { char: 'హ', name: 'Ha', old: '0x2DC (˜)', new: '0xE0 (à)', tala: 'false ✓' },
];

const all = [
  'క', 'ఖ', 'గ', 'ఘ', 'ఙ', 'చ', 'ఛ', 'జ', 'ఝ', 'ఞ',
  'ట', 'ఠ', 'డ', 'ఢ', 'ణ', 'త', 'థ', 'ద', 'ధ', 'న',
  'ప', 'ఫ', 'బ', 'భ', 'మ', 'య', 'ర', 'ల', 'ళ', 'వ',
  'శ', 'ష', 'స', 'హ', 'క్ష', 'ఱ'
];

const names = {
  'క': 'Ka', 'ఖ': 'Kha', 'గ': 'Ga', 'ఘ': 'Gha', 'ఙ': 'Nga',
  'చ': 'Cha', 'ఛ': 'Chha', 'జ': 'Ja', 'ఝ': 'Jha', 'ఞ': 'Nya',
  'ట': 'Ta', 'ఠ': 'Tha', 'డ': 'Da', 'ఢ': 'Dha', 'ణ': 'Na',
  'త': 'Tha', 'థ': 'Thha', 'ద': 'Dha', 'ధ': 'Dhha', 'న': 'Na',
  'ప': 'Pa', 'ఫ': 'Pha', 'బ': 'Ba', 'భ': 'Bha', 'మ': 'Ma',
  'య': 'Ya', 'ర': 'Ra', 'ల': 'La', 'ళ': 'La', 'వ': 'Va',
  'శ': 'Sha', 'ష': 'Sha', 'స': 'Sa', 'హ': 'Ha', 'క్ష': 'Ksha', 'ఱ': 'Ra'
};

const BASE = {
  'క': 'M', 'ఖ': 'Q', 'గ': 'V', 'ఘ': 'P', 'ఙ': '\\',
  'చ': '^', 'ఛ': 'b', 'జ': 'f', 'ఝ': 'm', 'ఞ': 'p',
  'ట': 'r', 'ఠ': 'u', 'డ': 'y', 'ఢ': 'É', 'ణ': String.fromCharCode(0xD7),
  'త': '™', 'థ': '£', 'ద': '§', 'ధ': '®', 'న': '¯',
  'ప': '²', 'ఫ': '¸', 'బ': 'º', 'భ': '¿', 'మ': 'G',
  'య': 'Å', 'ర': 'Æ', 'ల': String.fromCharCode(0xCC), 'వ': 'Ð',
  'శ': 'Ô', 'ష': String.fromCharCode(0x201E), 'స': '¨',
  'హ': String.fromCharCode(0xE0), 'ళ': 'â', 'క్ష': '„', 'ఱ': '‚',
};

const TALA = {
  'క': true, 'ఖ': false, 'గ': true, 'ఘ': true, 'ఙ': false,
  'చ': true, 'ఛ': false, 'జ': true, 'ఝ': false, 'ఞ': false,
  'ట': false, 'ఠ': true, 'డ': true, 'ఢ': true, 'ణ': false,
  'త': true, 'థ': true, 'ద': true, 'ధ': true, 'న': true,
  'ప': true, 'ఫ': false, 'బ': false, 'భ': true, 'మ': true,
  'య': true, 'ర': true, 'ల': false, 'వ': true, 'శ': true,
  'ష': true, 'స': true, 'హ': false, 'ళ': true, 'క్ష': true, 'ఱ': false,
};

function convert(char) {
  const base = BASE[char];
  if (!base) return char;
  const tala = TALA[char] ? String.fromCharCode(0xE6) : '';
  return base + tala;
}

const fixedChars = fixes.map(f => f.char);

// Fixed grid
const fixedGrid = document.getElementById('fixedGrid');
fixes.forEach(f => {
  const shree = convert(f.char);
  fixedGrid.innerHTML += `
    <div class="char-card fixed">
      <div class="unicode-display">${f.char}</div>
      <div class="shree-display">${shree}</div>
      <div class="char-label">${f.name}</div>
      <div class="fix-badge">FIXED</div>
    </div>
  `;
});

// All consonants grid
const allGrid = document.getElementById('allGrid');
all.forEach(char => {
  const shree = convert(char);
  const isFixed = fixedChars.includes(char);
  allGrid.innerHTML += `
    <div class="char-card ${isFixed ? 'fixed' : ''}">
      <div class="unicode-display">${char}</div>
      <div class="shree-display">${shree}</div>
      <div class="char-label">${names[char]}</div>
      ${isFixed ? '<div class="fix-badge">✓</div>' : ''}
    </div>
  `;
});

// Changes table
const tbody = document.querySelector('#changesTable tbody');
fixes.forEach(f => {
  tbody.innerHTML += `
    <tr>
      <td style="font-size: 1.25rem;">${f.char}</td>
      <td>${f.name}</td>
      <td><span class="code">${f.old}</span></td>
      <td class="arrow">→</td>
      <td><span class="code">${f.new}</span></td>
      <td>${f.tala}</td>
    </tr>
  `;
});
</script>
