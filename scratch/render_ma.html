<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @font-face {
            font-family: 'Shree-Tel';
            src: url('../public/SHREE-TEL-web.ttf');
        }
        body { font-family: sans-serif; font-size: 14px; padding: 20px;}
        .container { display: flex; flex-wrap: wrap; }
        .item { width: 90px; margin: 5px; border: 1px solid #ccc; text-align: center; }
        .shree { font-family: 'Shree-Tel'; font-size: 80px; background: #eee; min-height: 100px; line-height: 100px; }
    </style>
</head>
<body>
    <div class="container" id="grid">
        <div class="item"><div class="shree">&#x00AC;</div><div>0xAC</div></div>
        <div class="item"><div class="shree">&#x00AC;&#x00E6;</div><div>0xAC + E6</div></div>
        <div class="item"><div class="shree">&#x00C4;</div><div>0xC4</div></div>
        <div class="item"><div class="shree">&#x00C4;&#x00E6;</div><div>0xC4 + E6</div></div>
        
        <div class="item"><div class="shree">&#x0052;</div><div>0x52 (old ఘ, which is ఖ)</div></div>
        <div class="item"><div class="shree">&#x0052;&#x00E6;</div><div>0x52 + E6</div></div>
        <div class="item"><div class="shree">&#x0153;</div><div>0x153 (new ఘ?)</div></div>
        <div class="item"><div class="shree">&#x0153;&#x00E8;</div><div>0x153 + E8 (new ఘ?)</div></div>
    </div>
</body>
</html>
