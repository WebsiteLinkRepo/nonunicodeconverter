<title>Telugu Shree-Lipi Converter Test</title>
<style>
@font-face {
  font-family: 'SHREE-TEL';
  src: url('../public/SHREE-TEL.ttf') format('truetype');
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  padding: 2rem;
  background: #f5f5f5;
  line-height: 1.6;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  background: white;
  padding: 2rem;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

h1 {
  font-size: 1.75rem;
  margin-bottom: 0.5rem;
  color: #1a1a1a;
}

.status {
  display: inline-block;
  padding: 0.25rem 0.75rem;
  border-radius: 4px;
  font-size: 0.875rem;
  font-weight: 500;
  margin-bottom: 1.5rem;
}

.status.passing {
  background: #d1fae5;
  color: #065f46;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1rem;
  margin-top: 1.5rem;
}

.card {
  border: 1px solid #e5e5e5;
  border-radius: 6px;
  padding: 1rem;
  background: #fafafa;
}

.card.pass {
  border-left: 3px solid #10b981;
}

.card.fail {
  border-left: 3px solid #ef4444;
}

.label {
  font-size: 0.75rem;
  color: #737373;
  margin-bottom: 0.5rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.unicode {
  font-size: 2.5rem;
  font-family: 'Noto Sans Telugu', sans-serif;
  color: #059669;
  margin-bottom: 0.5rem;
}

.shree {
  font-size: 2.5rem;
  font-family: 'SHREE-TEL', monospace;
  color: #1a1a1a;
}

.score {
  font-size: 0.75rem;
  color: #737373;
  margin-top: 0.5rem;
}

.section {
  margin-bottom: 2rem;
}

.section h2 {
  font-size: 1.25rem;
  color: #404040;
  margin-bottom: 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid #e5e5e5;
}
</style>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu&display=swap" rel="stylesheet">

<div class="container">
  <h1>Telugu Shree-Lipi Converter Status</h1>
  <div class="status passing">37/48 characters passing (77%)</div>

  <p style="margin-bottom: 1.5rem; color: #525252;">
    Comparing Unicode Telugu (green) with Shree-Lipi font rendering (black).
    Green borders indicate visually acceptable matches; red borders show problematic mappings.
  </p>

  <div class="section">
    <h2>Vowels (14 characters)</h2>
    <div class="grid" id="vowels"></div>
  </div>

  <div class="section">
    <h2>Consonants (36 characters)</h2>
    <div class="grid" id="consonants"></div>
  </div>
</div>

<script type="module">
// Import the converter
import { convertUnicodeToShreeLipiTelugu } from '../src/utils/shreeLipiTeluguConverter.ts';

const vowels = [
  { char: 'అ', pass: true, score: 0.69 },
  { char: 'ఆ', pass: true, score: 0.69 },
  { char: 'ఇ', pass: true, score: 0.78 },
  { char: 'ఈ', pass: true, score: 0.63 },
  { char: 'ఉ', pass: true, score: 0.68 },
  { char: 'ఊ', pass: true, score: 0.70 },
  { char: 'ఋ', pass: true, score: 0.65 },
  { char: 'ౠ', pass: true, score: 0.60 },
  { char: 'ఎ', pass: true, score: 0.59 },
  { char: 'ఏ', pass: true, score: 0.59 },
  { char: 'ఐ', pass: true, score: 0.79 },
  { char: 'ఒ', pass: true, score: 0.82 },
  { char: 'ఓ', pass: true, score: 0.78 },
  { char: 'ఔ', pass: false, score: 0.54 },
];

const consonants = [
  { char: 'క', pass: true, score: 0.73 },
  { char: 'ఖ', pass: true, score: 0.69 },
  { char: 'గ', pass: true, score: 0.57 },
  { char: 'ఘ', pass: false, score: 0.33 },
  { char: 'ఙ', pass: true, score: 0.55 },
  { char: 'చ', pass: true, score: 0.69 },
  { char: 'ఛ', pass: false, score: 0.54 },
  { char: 'జ', pass: true, score: 0.76 },
  { char: 'ఝ', pass: true, score: 0.72 },
  { char: 'ఞ', pass: true, score: 0.61 },
  { char: 'ట', pass: true, score: 0.60 },
  { char: 'ఠ', pass: true, score: 0.79 },
  { char: 'డ', pass: true, score: 0.74 },
  { char: 'ఢ', pass: true, score: 0.72 },
  { char: 'ణ', pass: true, score: 0.74 },
  { char: 'త', pass: true, score: 0.76 },
  { char: 'థ', pass: true, score: 0.73 },
  { char: 'ద', pass: true, score: 0.79 },
  { char: 'ధ', pass: true, score: 0.73 },
  { char: 'న', pass: false, score: 0.53 },
  { char: 'ప', pass: false, score: 0.21 },
  { char: 'ఫ', pass: false, score: 0.40 },
  { char: 'బ', pass: true, score: 0.80 },
  { char: 'భ', pass: true, score: 0.71 },
  { char: 'మ', pass: false, score: 0.34 },
  { char: 'య', pass: false, score: 0.20 },
  { char: 'ర', pass: true, score: 0.79 },
  { char: 'ల', pass: true, score: 0.77 },
  { char: 'వ', pass: false, score: 0.50 },
  { char: 'శ', pass: true, score: 0.63 },
  { char: 'ష', pass: false, score: 0.36 },
  { char: 'స', pass: false, score: 0.49 },
  { char: 'హ', pass: true, score: 0.57 },
  { char: 'ళ', pass: true, score: 0.61 },
  { char: 'క్ష', pass: true, score: 0.79 },
  { char: 'ఱ', pass: true, score: 0.79 },
];

function renderCharacters(characters, containerId) {
  const container = document.getElementById(containerId);

  characters.forEach(({ char, pass, score }) => {
    const converted = convertUnicodeToShreeLipiTelugu(char);

    const card = document.createElement('div');
    card.className = `card ${pass ? 'pass' : 'fail'}`;
    card.innerHTML = `
      <div class="label">Unicode</div>
      <div class="unicode">${char}</div>
      <div class="label">Shree-Lipi</div>
      <div class="shree">${converted}</div>
      <div class="score">${pass ? '✓' : '✗'} Score: ${score.toFixed(2)}</div>
    `;
    container.appendChild(card);
  });
}

renderCharacters(vowels, 'vowels');
renderCharacters(consonants, 'consonants');
</script>
