<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @font-face {
            font-family: 'Shree-Tel';
            src: url('../public/SHREE-TEL-web.ttf');
        }
        body { font-family: sans-serif; font-size: 14px; padding: 20px;}
        .container { display: flex; flex-wrap: wrap; }
        .item { width: 80px; margin: 5px; border: 1px solid #ccc; text-align: center; }
        .shree { font-family: 'Shree-Tel'; font-size: 48px; background: #eee; min-height: 60px; line-height: 60px; }
    </style>
</head>
<body>
    <div class="container" id="grid"></div>
    <script>
        const grid = document.getElementById('grid');
        const codes = [];
        for (let i = 0x20; i <= 0xFF; i++) {
            codes.push(i);
        }
        for (const code of codes) {
            const div = document.createElement('div');
            div.className = 'item';
            
            const charDiv = document.createElement('div');
            charDiv.className = 'shree';
            charDiv.innerHTML = '&#' + code + ';';
            
            const labelDiv = document.createElement('div');
            labelDiv.innerText = '0x' + code.toString(16).toUpperCase().padStart(2, '0');
            
            div.appendChild(charDiv);
            div.appendChild(labelDiv);
            grid.appendChild(div);
        }
    </script>
</body>
</html>
