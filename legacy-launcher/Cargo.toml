[package]
name = "nonunicodeconverter-legacy"
version = "0.1.0"
edition = "2021"

[dependencies]
tiny_http = "0.12"
rust-embed = "8.2.0"
mime_guess = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
]
