<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: sans-serif; padding: 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; }
  .cell { border: 1px solid #ccc; padding: 10px; text-align: center; }
  .char { font-family: 'NeoGaneshBold'; font-size: 40px; color: red; }
  .code { font-size: 14px; font-weight: bold; color: #333; margin-top: 10px; }
</style>
</head>
<body>
<h2>The True Matra?</h2>
<div class="grid">
<script>
const candidates = [231]; // 231 is 'ç'
for(let i of candidates) {
  const bhasha = String.fromCharCode(167) + String.fromCharCode(i) + String.fromCharCode(202) + String.fromCharCode(i);
  document.write('<div class="cell"><div class="char">' + bhasha + '</div><div class="code">Byte: ' + i + ' (ç)</div></div>');
}
</script>
</div>
</body>
</html>
