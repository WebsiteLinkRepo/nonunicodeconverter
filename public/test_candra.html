<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: sans-serif; padding: 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; }
  .cell { border: 1px solid #ccc; padding: 10px; text-align: center; }
  .char { font-family: 'NeoGaneshBold'; font-size: 40px; color: red; }
  .code { font-size: 14px; font-weight: bold; color: #333; margin-top: 10px; }
</style>
</head>
<body>
<h2>Find the Candra (Half-moon without dot) for डॉक्टर</h2>
<p>Base letter is 103 (ड) + A-matra 231 (ç). We are looking for the half-moon on top.</p>
<div class="grid">
<script>
const candidates = [122, 123, 126, 127, 128, 129, 130, 131, 132, 133];
for(let i of candidates) {
  const char = String.fromCharCode(103) + String.fromCharCode(231) + String.fromCharCode(i);
  document.write('<div class="cell"><div class="char">' + char + '</div><div class="code">Byte: ' + i + '</div></div>');
}
</script>
</div>
</body>
</html>
