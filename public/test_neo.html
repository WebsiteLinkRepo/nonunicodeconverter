<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: sans-serif; padding: 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .cell { border: 1px solid #ccc; padding: 10px; text-align: center; width: 60px; }
  .char { font-family: 'NeoGaneshBold'; font-size: 30px; color: red; margin-bottom: 5px; }
  .code { font-size: 12px; font-weight: bold; color: #333; }
</style>
</head>
<body>
<h2>NeoGaneshBold Character Map</h2>
<div class="grid">
<script>
for(let i=32; i<=255; i++) {
  document.write('<div class="cell"><div class="char">' + String.fromCharCode(i) + '</div><div class="code">' + i + '</div></div>');
}
</script>
</div>
</body>
</html>
