name: Build RTF Clipboard POC v2 (Windows 7 Compatible)

on:
  push:
    branches: [ master ]
    paths:
      - 'rtf-clipboard-poc-v2/**'
      - '.github/workflows/build-rtf-poc-v2.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'rtf-clipboard-poc-v2/**'
  workflow_dispatch:

jobs:
  build-native-host:
    name: Build Native Host (Win7 Compatible - Rust 1.77)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust 1.77 (Last version supporting Windows 7)
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.77.2
        targets: i686-pc-windows-msvc,x86_64-pc-windows-msvc

    - name: Build Native Host (32-bit for Win7 - Rust 1.77 MSVC static CRT)
      working-directory: rtf-clipboard-poc-v2/native-host
      run: cargo +1.77.2 build --release --target i686-pc-windows-msvc

    - name: Build Native Host (64-bit - Rust 1.77 MSVC static CRT)
      working-directory: rtf-clipboard-poc-v2/native-host
      run: cargo +1.77.2 build --release --target x86_64-pc-windows-msvc

    - name: Upload 64-bit Native Host
      uses: actions/upload-artifact@v4
      with:
        name: rtf_native_host-x64
        path: rtf-clipboard-poc-v2/native-host/target/x86_64-pc-windows-msvc/release/rtf_native_host.exe

    - name: Upload 32-bit Native Host (Win7)
      uses: actions/upload-artifact@v4
      with:
        name: rtf_native_host-x86-win7
        path: rtf-clipboard-poc-v2/native-host/target/i686-pc-windows-msvc/release/rtf_native_host.exe

  build-verification-tool:
    name: Build Clipboard Inspector (Win7 Compatible - Rust 1.77)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust 1.77 (Last version supporting Windows 7)
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.77.2
        targets: i686-pc-windows-msvc,x86_64-pc-windows-msvc

    - name: Build Verification Tool (64-bit - Rust 1.77 MSVC static CRT)
      working-directory: rtf-clipboard-poc-v2/verification
      run: cargo +1.77.2 build --release --target x86_64-pc-windows-msvc

    - name: Build Verification Tool (32-bit for Win7 - Rust 1.77 MSVC static CRT)
      working-directory: rtf-clipboard-poc-v2/verification
      run: cargo +1.77.2 build --release --target i686-pc-windows-msvc

    - name: Upload 64-bit Verification Tool
      uses: actions/upload-artifact@v4
      with:
        name: clipboard_inspector-x64
        path: rtf-clipboard-poc-v2/verification/target/x86_64-pc-windows-msvc/release/clipboard_inspector.exe

    - name: Upload 32-bit Verification Tool (Win7)
      uses: actions/upload-artifact@v4
      with:
        name: clipboard_inspector-x86-win7
        path: rtf-clipboard-poc-v2/verification/target/i686-pc-windows-msvc/release/clipboard_inspector.exe

  build-standalone-test:
    name: Build Standalone Clipboard Test (Win7 Compatible - Rust 1.77)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust 1.77 (Last version supporting Windows 7)
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.77.2
        targets: i686-pc-windows-msvc,x86_64-pc-windows-msvc

    - name: Build Standalone Test (32-bit for Win7 - Rust 1.77 MSVC static CRT)
      working-directory: rtf-clipboard-poc-v2/standalone-test
      run: cargo +1.77.2 build --release --target i686-pc-windows-msvc

    - name: Build Standalone Test (64-bit - Rust 1.77 MSVC static CRT)
      working-directory: rtf-clipboard-poc-v2/standalone-test
      run: cargo +1.77.2 build --release --target x86_64-pc-windows-msvc

    - name: Upload 32-bit Standalone Test (Win7)
      uses: actions/upload-artifact@v4
      with:
        name: rtf_clipboard_test-x86-win7
        path: rtf-clipboard-poc-v2/standalone-test/target/i686-pc-windows-msvc/release/rtf_clipboard_test.exe

    - name: Upload 64-bit Standalone Test
      uses: actions/upload-artifact@v4
      with:
        name: rtf_clipboard_test-x64
        path: rtf-clipboard-poc-v2/standalone-test/target/x86_64-pc-windows-msvc/release/rtf_clipboard_test.exe

  package-release:
    name: Package Complete POC v2
    runs-on: ubuntu-latest
    needs: [build-native-host, build-verification-tool, build-standalone-test]

    steps:
    - uses: actions/checkout@v4

    - name: Download 32-bit Native Host
      uses: actions/download-artifact@v4
      with:
        name: rtf_native_host-x86-win7
        path: release/x86/

    - name: Download 32-bit Verification Tool
      uses: actions/download-artifact@v4
      with:
        name: clipboard_inspector-x86-win7
        path: release/x86/

    - name: Download 64-bit Native Host
      uses: actions/download-artifact@v4
      with:
        name: rtf_native_host-x64
        path: release/x64/

    - name: Download 64-bit Verification Tool
      uses: actions/download-artifact@v4
      with:
        name: clipboard_inspector-x64
        path: release/x64/

    - name: Download 32-bit Standalone Test
      uses: actions/download-artifact@v4
      with:
        name: rtf_clipboard_test-x86-win7
        path: release/x86/

    - name: Download 64-bit Standalone Test
      uses: actions/download-artifact@v4
      with:
        name: rtf_clipboard_test-x64
        path: release/x64/

    - name: Copy Extension and Installer
      run: |
        cp -r rtf-clipboard-poc-v2/chrome-extension release/
        cp -r rtf-clipboard-poc-v2/installer release/
        cp rtf-clipboard-poc-v2/README.md release/

    - name: Create Installation Instructions
      run: |
        cat > release/INSTALL.txt << 'EOF'
        RTF Clipboard POC v2 - Windows 7 Compatible Build
        ==================================================

        Built with Rust 1.77.2 - the last version supporting Windows 7.

        This POC uses the PROVEN RTF clipboard code from src-tauri/legacy-launcher
        that already works with Adobe PageMaker 7.0.

        STEP 1: Test the clipboard code directly (REQUIRED FIRST)
        =========================================================

        For Windows 7/8/8.1 (32-bit):
        1. Run: x86\rtf_clipboard_test.exe
        2. Run: x86\clipboard_inspector.exe
        3. Verify it reports: "Rich Text Format: FOUND"

        For Windows 10/11 (64-bit):
        1. Run: x64\rtf_clipboard_test.exe
        2. Run: x64\clipboard_inspector.exe
        3. Verify it reports: "Rich Text Format: FOUND"

        ❌ If NOT FOUND: There's a Windows 7 compatibility issue
        ✅ If FOUND: The clipboard code works! Proceed to Step 2

        STEP 2: Full Native Messaging integration (Chrome Extension)
        =============================================================

        For Windows 7/8/8.1 (32-bit):
        1. Use files from the x86/ folder
        2. Copy rtf_native_host.exe somewhere permanent
        3. Run: powershell -ExecutionPolicy Bypass -File installer\install.ps1
        4. Load chrome-extension/ in your browser
        5. Update manifest with your extension ID
        6. Restart browser
        7. Click extension "Test Native RTF" button
        8. Run clipboard_inspector.exe to verify

        For Windows 10/11 (64-bit):
        1. Use files from the x64/ folder
        2. Follow same steps as above

        Final verification:
        - Paste in Adobe PageMaker 7.0 to confirm Arial font applies

        Files:
        - rtf_clipboard_test.exe = Standalone clipboard test (Step 1)
        - rtf_native_host.exe = Native messaging host (Step 2)
        - clipboard_inspector.exe = Verification tool
        - chrome-extension/ = Browser extension (Step 2)
        - installer/ = PowerShell installer script (Step 2)

        Technical Note:
        - Built with Rust 1.77.2 MSVC toolchain + static CRT linking
        - C runtime statically linked - NO Visual C++ Runtime required
        - Does NOT require api-ms-win-core-synch-l1-2-0.dll (Windows 8+ API)
        - Uses only Windows 7-compatible Win32 APIs
        - Truly standalone executables - zero dependencies
        EOF

    - name: Upload Complete Package
      uses: actions/upload-artifact@v4
      with:
        name: rtf-clipboard-poc-v2-complete-win7
        path: release/
