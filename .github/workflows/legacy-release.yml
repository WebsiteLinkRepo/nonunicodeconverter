name: Legacy Release (Supermium)

on:
  push:
    tags:
      - 'legacy-v*'
  workflow_dispatch:

jobs:
  build-legacy:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend (Astro)
        run: npm run build

      - name: Setup Rust (1.77 for Win7/8/8.1 compatibility)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.77
          targets: i686-pc-windows-msvc

      - name: Build Legacy Launcher
        working-directory: legacy-launcher
        run: cargo build --target i686-pc-windows-msvc --release

      - name: Download Supermium 122 (32-bit SSE2)
        run: |
          curl -L -o supermium_setup.exe https://github.com/win32ss/supermium/releases/download/v122-hf/supermium_122_32_setup.exe
          $hash = (Get-FileHash supermium_setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '28f67289841f1ea2328c5071d6acf30b47fc108e2168cf9dbcb0effa670bed3b') {
            Write-Error "Checksum mismatch! Expected 28f67289841f1ea2328c5071d6acf30b47fc108e2168cf9dbcb0effa670bed3b but got $hash"
            exit 1
          }

      - name: Extract Supermium
        run: |
          # Extract the installer
          7z x supermium_setup.exe -osupermium_extracted

          # List what we got to understand the structure
          Write-Host "=== Contents of supermium_extracted ==="
          Get-ChildItem supermium_extracted -Recurse | Select-Object FullName

          # Find any .7z archive inside
          $chromeArchive = Get-ChildItem supermium_extracted -Filter "*.7z" -Recurse | Select-Object -First 1

          if ($chromeArchive) {
            Write-Host "=== Found archive: $($chromeArchive.FullName) ==="
            # Extract it
            7z x $chromeArchive.FullName -osupermium_extracted\supermium_runtime

            # Find Chrome-bin or equivalent
            $chromeBin = Get-ChildItem supermium_extracted\supermium_runtime -Directory -Recurse -Filter "*Chrome*" | Select-Object -First 1

            if ($chromeBin) {
              Write-Host "=== Found Chrome directory: $($chromeBin.FullName) ==="
              # Move contents to final location
              New-Item -ItemType Directory -Force -Path NonUnicodeConverterLegacy\supermium
              Move-Item -Path "$($chromeBin.FullName)\*" -Destination "NonUnicodeConverterLegacy\supermium" -Force
            } else {
              Write-Host "=== No Chrome-bin found, using runtime root ==="
              New-Item -ItemType Directory -Force -Path NonUnicodeConverterLegacy\supermium
              Move-Item -Path "supermium_extracted\supermium_runtime\*" -Destination "NonUnicodeConverterLegacy\supermium" -Force
            }
          } else {
            Write-Host "=== No .7z archive found, using direct extraction ==="
            # Maybe it extracted directly - look for Chrome executables
            $chromeExe = Get-ChildItem supermium_extracted -Filter "chrome.exe" -Recurse | Select-Object -First 1
            if ($chromeExe) {
              $chromeDir = $chromeExe.Directory
              Write-Host "=== Found chrome.exe at: $($chromeDir.FullName) ==="
              New-Item -ItemType Directory -Force -Path NonUnicodeConverterLegacy\supermium
              Move-Item -Path "$($chromeDir.FullName)\*" -Destination "NonUnicodeConverterLegacy\supermium" -Force
            } else {
              Write-Error "Could not find Supermium runtime in extraction"
              exit 1
            }
          }
          
      - name: Package Legacy Bundle
        run: |
          Copy-Item -Path "legacy-launcher\target\i686-pc-windows-msvc\release\nonunicodeconverter-legacy.exe" -Destination "NonUnicodeConverterLegacy\NonUnicodeConverter.exe"
          Compress-Archive -Path NonUnicodeConverterLegacy -DestinationPath NonUnicodeConverter-Legacy-Windows-x86.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NonUnicodeConverter-Legacy-Windows-x86
          path: NonUnicodeConverter-Legacy-Windows-x86.zip
          if-no-files-found: error
