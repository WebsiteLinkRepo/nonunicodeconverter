name: Build PageMaker Helper

on:
  push:
    branches:
      - main
    paths:
      - 'pagemaker-helper/**'
      - 'pagemaker-installer/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Build Rust Executable
        run: cargo build --release --target i686-pc-windows-msvc
        working-directory: pagemaker-helper

      - name: Compile Inno Setup Installer
        run: |
          "C:\Program Files (x86)\Inno Setup 6\iscc.exe" setup.iss
        working-directory: pagemaker-installer

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PageMakerAutoFontChangerSetup
          path: pagemaker-installer/Output/PageMakerAutoFontChangerSetup.exe
