name: "Release App"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install app dependencies
        run: npm install

      - name: build tauri app (Modern)
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'Download the modern app for Windows 10/11 or the legacy app for Windows XP/7/8.'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: build legacy app (XP/Vista)
        shell: bash
        run: |
          mkdir -p legacy-app/supermium-portable
          # Download a lightweight dummy file or actual supermium if available.
          curl -L -o supermium.zip "https://github.com/win32ss/supermium/releases/download/v122-hf/supermium_122_32_portable.zip" || echo "Failed"
          unzip -q supermium.zip -d legacy-app/supermium-portable || echo "Failed to unzip"
          
          # Install NSIS
          choco install nsis
          
          # Compile NSIS script and rename to legacy
          makensis legacy-app/installer.nsi
          mv legacy-app/nonunicodeconverter-xp.exe legacy-app/nonunicodeconverter-legacy.exe

      - name: build retro app (Win98)
        shell: bash
        run: |
          mkdir -p retro-app/retrozilla-portable
          # Dummy download for RetroZilla
          curl -L -o retrozilla.zip "https://github.com/rn10950/RetroZilla/releases/download/2.2/retrozilla-2.2.zip" || echo "Failed"
          unzip -q retrozilla.zip -d retro-app/retrozilla-portable || echo "Failed to unzip"
          
          # Compile NSIS script
          makensis retro-app/installer.nsi

      - name: Upload Legacy and Retro Apps to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            legacy-app/nonunicodeconverter-legacy.exe
            retro-app/nonunicodeconverter-retro.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
